<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Atrapa `beforeinstallprompt`, que se dispara a los ~180 ms y una sola vez. Va
         `async` porque un script clásico sin eso frena el parseo del HTML, y el bundle es
         un módulo que sólo ejecuta cuando el parseo termina. El porqué está en el archivo,
         incluido por qué el adelanto de los pedidos de la API que vivía ahí se fue. -->
    <script async src="./temprano.js"></script>

    <!-- Abrir la conexión con la API mientras todavía se parsea el HTML: en 3G el apretón
         de manos (DNS + TCP + TLS) son varios cientos de milisegundos que si no se pagan
         recién con el primer pedido. Esto NO ejecuta JavaScript ni toca el hilo principal,
         que es exactamente la diferencia con adelantar los pedidos a mano. -->
    <link rel="preconnect" href="https://api.cromeros.com.ar" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4a11d" />
    <link rel="icon" type="image/svg+xml" href="./bola.svg" />

    <!-- Para instalarla en el teléfono. Los de apple- son para iPhone, que ignora casi
         todo el manifest: el ícono y el nombre los saca de acá. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cromeros" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Mi colección de Dragon Ball Z</title>
  </head>
  <body>
    <!-- El cartel de espera va ACÁ y no sólo en React, y es el cambio que más bajó el
         primer pintado de toda la app.

         La app se dibuja del lado del navegador, así que con `#root` vacío no hay
         literalmente nada que pintar hasta que bajen los 59 KB del bundle, los parsee y
         React monte. Medido en 3G con la CPU 6 veces más lenta, el primer pintado daba
         1156 ms, y lo único que aparecía en ese momento era esta misma palabra — el
         `if (cuenta === undefined)` de App.jsx. O sea que se esperaba el bundle entero
         para mostrar un cartel de espera.

         El CSS ya está en el head como <link> (lo pone Vite), y es de los que frenan el
         pintado, así que cuando el navegador puede pintar algo ya tiene `.hoja` y
         `.cargando`: se ve idéntico a lo que dibuja React, y por eso al montar no hay
         ningún salto. React limpia lo que haya adentro del contenedor cuando monta, que
         es lo que corresponde: esto es render del lado del cliente, no hidratación, así
         que no hay que calzar nada ni agregar `suppressHydrationWarning`.

         TIENE QUE DECIR LO MISMO QUE App.jsx. Si algún día cambia el texto o las clases
         de ese estado, esto queda desincronizado y se ve un parpadeo al montar. -->
    <div id="root"><div class="hoja"><p class="cargando">Cargando…</p></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
