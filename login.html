<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Atrapa `beforeinstallprompt`, que se dispara a los ~180 ms y una sola vez. Va
         `async` porque un script clásico sin eso frena el parseo del HTML, y el bundle es
         un módulo que sólo ejecuta cuando el parseo termina. -->
    <script async src="./early.js"></script>

    <!-- Abrir la conexión con la API mientras todavía se parsea el HTML. -->
    <link rel="preconnect" href="https://api.cromeros.com.ar" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4a11d" />
    <link rel="icon" type="image/svg+xml" href="./bola.svg" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <!-- El estándar primero y el de Apple después: Chrome avisa por consola que
         `apple-mobile-web-app-capable` está deprecado y pide éste. Los dos conviven porque
         iPhone sigue leyendo sólo el suyo. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cromeros" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Ver el porqué en `collection.html`: esto es el cascarón de la app, no contenido. -->
    <!-- La tarjeta de la vista previa: quien comparte la app copia la URL desde la barra,
         y adentro de la app la barra dice /collection o /login, no la landing. Sin esto la
         tarjeta de WhatsApp salía sin imagen ni texto. El noindex de abajo gobierna la
         indexación, no las tarjetas: conviven. Lo ata pages.test.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cromeros" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://cromeros.com.ar/" />
    <meta property="og:title" content="Mi colección de Dragon Ball Z" />
    <meta property="og:description" content="Marcá las que tenés, las que te faltan y las repetidas, y compartí la lista en tu grupo. Cromeros 2007 y Leyenda." />
    <meta property="og:image" content="https://cromeros.com.ar/icono-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="La Z de Dragon Ball Z" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mi colección de Dragon Ball Z" />
    <meta name="twitter:description" content="Marcá las que tenés, las que te faltan y las repetidas, y compartí la lista en tu grupo. Cromeros 2007 y Leyenda." />
    <meta name="twitter:image" content="https://cromeros.com.ar/icono-512.png" />

    <meta name="robots" content="noindex" />
    <title>Entrar · Mi colección de Dragon Ball Z</title>
  </head>
  <body>
    <!-- TIENE QUE DECIR LO MISMO QUE `collection.html` Y QUE `App.jsx`. Lo ata un test
         (`test/pages.test.js`). -->
    <div id="root"><div class="sheet"><p class="loading">Cargando…</p></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
